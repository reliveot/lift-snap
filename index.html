<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>吱吱早餐店：手功能復健大挑戰 V2.1</title>
<style>
  :root {
    --bg-warm: #f7f3ea;
    --primary: #7b5942;
    --accent: #697655;
    --text-dark: #43392f;
    --btn-active: #a04f32;
    --btn-dis: #a3a19e;
    --locked-bg: #8c8c8c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: var(--bg-warm);
    font-family: "Noto Sans TC", sans-serif;
    color: var(--text-dark);
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 遊戲外框，強制 16:9 或自適應 */
  #game-container {
    width: 100vw;
    height: 56.25vw; /* 16:9 */
    max-width: 1120px;
    max-height: 630px;
    background: #fffdf9;
    border: 3px solid var(--primary);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(107,80,54,0.15);
  }

  /* 關卡與頂部 UI */
  .top-bar {
    position: absolute;
    top: 8px; left: 12px; right: 12px;
    height: 42px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .info-tag {
    background: #fbf5eb;
    border: 2.2px solid var(--primary);
    border-radius: 20px;
    padding: 4px 12px;
    font-weight: 800;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 3px 0 var(--primary);
  }
  .btn-setting {
    background: #f7ede2;
    border: 2.2px solid var(--primary);
    border-radius: 50%;
    width: 36px; height: 36px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 3px 0 var(--primary);
  }
  .btn-setting:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--primary); }

  /* 吧檯與顧客區 */
  .counter-area {
    position: absolute;
    top: 50px; left: 0; right: 0;
    height: 140px;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    padding-bottom: 5px;
    border-bottom: 6px solid #8c6a51; /* 吧檯邊緣 */
    background: #e2d1c3; /* 吧檯木紋 */
  }
  /* 顧客座位 */
  .seat {
    width: 90px;
    height: 125px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
  }
  /* 客人外觀 (日系手繪) */
  .customer-sprite {
    width: 75px; height: 75px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: bottom center;
    transition: transform 0.3s ease;
  }
  .seat.waiting .customer-sprite { animation: float-slow 3s ease-in-out infinite; }
  @keyframes float-slow {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* 泡泡框 - 點單 & 對話 */
  .bubble {
    position: absolute;
    top: -30px;
    background: #ffffff;
    border: 2px solid var(--primary);
    border-radius: 12px;
    padding: 4px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    z-index: 5;
    pointer-events: none;
    transform-origin: bottom center;
    animation: pop-in 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 50%;
    transform: translateX(-50%);
    border-width: 8px 8px 0;
    border-style: solid;
    border-color: #ffffff transparent;
  }
  .bubble::before {
    content: '';
    position: absolute;
    bottom: -10.5px; left: 50%;
    transform: translateX(-50%);
    border-width: 9px 9px 0;
    border-style: solid;
    border-color: var(--primary) transparent;
    z-index: -1;
  }
  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .order-item {
    width: 32px; height: 32px;
    background-size: contain;
    background-repeat: no-repeat;
  }
  .patience-bar {
    width: 34px; height: 4px;
    background: #e0e0e0;
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .patience-inner {
    height: 100%;
    background: #81b29a;
    width: 100%;
    transition: width 0.1s linear, background-color 0.5s ease;
  }

  /* 吧檯出餐盤 */
  .plate-spot {
    position: absolute;
    bottom: -15px;
    width: 46px; height: 18px;
    background: #ffffff;
    border: 1.5px solid #c2b3a3;
    border-radius: 50%;
    box-shadow: 0 2px 3px rgba(0,0,0,0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .plate-spot:active { transform: scale(0.95); }
  .plate-spot .held-food {
    width: 32px; height: 32px;
    transform: translateY(-12px);
    background-size: contain;
    background-repeat: no-repeat;
    pointer-events: none;
  }

  /* 備料與廚房區域 */
  .kitchen-area {
    position: absolute;
    top: 196px; left: 0; right: 0; bottom: 0;
    background: #efe6dc;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  /* 工作站 (Station) 樣式 */
  .station {
    background: #fffefb;
    border: 2.2px solid var(--primary);
    border-radius: 12px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    position: relative;
    box-shadow: 0 4px 0 var(--primary);
    transition: all 0.3s ease;
  }
  .station:not(.disabled):active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--primary);
  }

  /* V2.1 強化未解鎖區與油條區：更低透明度、灰階、鎖頭視覺 */
  .station.disabled {
    opacity: 0.22 !important;
    filter: grayscale(100%) blur(0.5px) !important;
    cursor: not-allowed;
    background: #e0dcd5;
    pointer-events: none;
  }
  .lock-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #4a4a4a;
    font-weight: 800;
    font-size: 13px;
    border-radius: 10px;
    z-index: 8;
  }
  .lock-icon { font-size: 24px; margin-bottom: 2px; }

  .station-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--primary);
    background: #faeae1;
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid var(--primary);
  }

  /* 工作站內容（插圖與操作） */
  .station-asset {
    width: 60px; height: 60px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    position: relative;
  }

  /* 烹飪進度條與狀態 */
  .cooking-bar {
    width: 80%;
    height: 8px;
    background: #e0e0e0;
    border: 1.5px solid var(--primary);
    border-radius: 4px;
    overflow: hidden;
    position: absolute;
    bottom: 30px;
    left: 10%;
    display: none;
  }
  .cooking-progress {
    height: 100%;
    background: #e07a5f;
    width: 0%;
    transition: width 0.1s linear;
  }

  .action-btn {
    width: 100%;
    background: #fdf2e9;
    border: 2px solid var(--primary);
    border-radius: 8px;
    padding: 3px 0;
    font-size: 12px;
    font-weight: 800;
    color: var(--primary);
    box-shadow: 0 2px 0 var(--primary);
    cursor: pointer;
    text-align: center;
  }
  .action-btn:active {
    transform: translateY(1px);
    box-shadow: 0 1px 0 var(--primary);
  }
  .action-btn.active-make {
    background: #e76f51;
    color: #fff;
  }
  .action-btn.ready-get {
    background: #81b29a;
    color: #fff;
    animation: pulse 1s infinite alternate;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.03); }
  }

  /* 提示覆蓋層 */
  #action-hand {
    position: absolute;
    width: 48px; height: 48px;
    background-size: contain;
    background-repeat: no-repeat;
    pointer-events: none;
    z-index: 999;
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    transform: translate(-50%, -50%);
    display: none;
  }

  /* 彈出視窗與設置（仿電子名片溫潤紙質風格） */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(43,33,24,0.45);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .modal-box {
    width: 90%;
    max-width: 520px;
    max-height: 92%;
    background: #fffdf9;
    border: 3.5px solid var(--primary);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 20px;
    font-weight: 900;
    color: var(--primary);
    text-align: center;
    margin-bottom: 2px;
    border-bottom: 2px dashed #eadfce;
    padding-bottom: 6px;
  }
  .modal-desc {
    font-size: 12.5px;
    line-height: 1.5;
    color: #5c5246;
  }
  .mode-select {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin: 6px 0;
  }
  .mode-btn {
    background: #fbf5eb;
    border: 2px solid #ccc;
    border-radius: 12px;
    padding: 10px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
  }
  .mode-btn.selected {
    border-color: var(--accent);
    background: #f0f4eb;
    box-shadow: 0 0 0 2px var(--accent);
  }
  .mode-btn-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--primary);
    display: flex;
    justify-content: space-between;
  }
  .mode-btn-desc {
    font-size: 11px;
    color: #6e6355;
    margin-top: 2px;
  }

  /* V2.1 吱吱復健資源延伸卡片 */
  .rehab-card {
    background: #fbf9f4;
    border: 2px solid #eadfce;
    border-radius: 12px;
    padding: 12px;
    margin-top: 4px;
    box-shadow: inset 0 2px 4px rgba(107,80,54,0.03);
  }
  .rehab-card-title {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .rehab-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .rehab-link-group {
    background: #ffffff;
    border: 1px solid #e5dacb;
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .rehab-link-label {
    font-size: 10px;
    font-weight: 800;
    color: #8c7f6e;
    margin-bottom: 2px;
  }
  .rehab-anchor {
    font-size: 11.5px;
    font-weight: 800;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
    line-height: 1.3;
  }
  .rehab-anchor:hover { color: var(--primary); }

  .start-btn {
    background: #697655;
    color: #fff;
    border: 3px solid var(--primary);
    border-radius: 12px;
    padding: 10px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--primary);
    text-align: center;
  }
  .start-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--primary);
  }

  /* 彈出提示特效 (Flyup) */
  .fly-text {
    position: absolute;
    color: #e07a5f;
    font-weight: 900;
    font-size: 20px;
    pointer-events: none;
    z-index: 1000;
    animation: fly-up-fade 0.8s ease-out forwards;
  }
  @keyframes fly-up-fade {
    0% { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
    30% { transform: translate(-50%, -15px) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -40px) scale(0.9); opacity: 0; }
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- 頂部資訊列 -->
  <div class="top-bar">
    <div class="info-tag" id="level-display">關卡: 載入中</div>
    <div class="info-tag" id="score-display">🌟 分數: 0</div>
    <div class="info-tag" id="timer-display">⏱️ 時間: 45</div>
    <button class="btn-setting" onclick="openSetting()">⚙️</button>
  </div>

  <!-- 客人吧檯區 -->
  <div class="counter-area" id="counter-area">
    <!-- 4 個座位 -->
    <div class="seat" id="seat-0" onclick="deliverOrder(0)">
      <div class="bubble" id="bubble-0" style="display:none">
        <div class="order-item" id="order-img-0"></div>
        <div class="patience-bar"><div class="patience-inner" id="patience-0"></div></div>
      </div>
      <div class="customer-sprite" id="cust-sprite-0"></div>
      <div class="plate-spot" onclick="clickPlate(event, 0)" id="plate-0"></div>
    </div>
    <div class="seat" id="seat-1" onclick="deliverOrder(1)">
      <div class="bubble" id="bubble-1" style="display:none">
        <div class="order-item" id="order-img-1"></div>
        <div class="patience-bar"><div class="patience-inner" id="patience-1"></div></div>
      </div>
      <div class="customer-sprite" id="cust-sprite-1"></div>
      <div class="plate-spot" onclick="clickPlate(event, 1)" id="plate-1"></div>
    </div>
    <div class="seat" id="seat-2" onclick="deliverOrder(2)">
      <div class="bubble" id="bubble-2" style="display:none">
        <div class="order-item" id="order-img-2"></div>
        <div class="patience-bar"><div class="patience-inner" id="patience-2"></div></div>
      </div>
      <div class="customer-sprite" id="cust-sprite-2"></div>
      <div class="plate-spot" onclick="clickPlate(event, 2)" id="plate-2"></div>
    </div>
    <div class="seat" id="seat-3" onclick="deliverOrder(3)">
      <div class="bubble" id="bubble-3" style="display:none">
        <div class="order-item" id="order-img-3"></div>
        <div class="patience-bar"><div class="patience-inner" id="patience-3"></div></div>
      </div>
      <div class="customer-sprite" id="cust-sprite-3"></div>
      <div class="plate-spot" onclick="clickPlate(event, 3)" id="plate-3"></div>
    </div>
  </div>

  <!-- 廚房作業區 -->
  <div class="kitchen-area">
    <!-- 1. 蛋餅煎台 (Station 1) -->
    <div class="station" id="station-0" onclick="clickStation(0)">
      <span class="station-title">🍳 蛋餅煎台</span>
      <div class="station-asset" id="asset-0"></div>
      <div class="cooking-bar" id="cookbar-0"><div class="cooking-progress" id="progress-0"></div></div>
      <button class="action-btn" id="btn-0">製作蛋餅 (2s)</button>
    </div>

    <!-- 2. 蘿蔔糕煎台 (Station 2) -->
    <div class="station" id="station-1" onclick="clickStation(1)">
      <span class="station-title">⬜ 蘿蔔糕煎台</span>
      <div class="station-asset" id="asset-1"></div>
      <div class="cooking-bar" id="cookbar-1"><div class="cooking-progress" id="progress-1"></div></div>
      <button class="action-btn" id="btn-1">製作蘿蔔糕 (3s)</button>
    </div>

    <!-- 3. 豆漿調製區 (Station 3) -->
    <div class="station" id="station-2" onclick="clickStation(2)">
      <span class="station-title">🥤 豆漿區</span>
      <div class="station-asset" id="asset-2"></div>
      <div class="cooking-bar" id="cookbar-2"><div class="cooking-progress" id="progress-2"></div></div>
      <button class="action-btn" id="btn-2">裝豆漿 (1.5s)</button>
    </div>

    <!-- 4. 燒餅油條區 (Station 4) - 進階解鎖 -->
    <div class="station disabled" id="station-3" onclick="clickStation(3)">
      <span class="station-title">🥖 燒餅油條</span>
      <div class="station-asset" id="asset-3"></div>
      <div class="cooking-bar" id="cookbar-3"><div class="cooking-progress" id="progress-3"></div></div>
      <button class="action-btn" id="btn-3" disabled>烤燒餅夾油條 (4s)</button>
      <div class="lock-overlay" id="lock-3">
        <span class="lock-icon">🔒</span>
        <span>進階解鎖</span>
      </div>
    </div>
  </div>

  <!-- 引導輔助手指 -->
  <div id="action-hand"></div>
</div>

<!-- 設定與模式選擇彈窗 -->
<div class="modal-overlay" id="setting-modal">
  <div class="modal-box">
    <div class="modal-title">🎨 吱吱早餐店 設定與關卡</div>
    <div class="modal-desc">
      選擇合適的關卡來挑戰您的「患側手、雙手協調、專注與反應力」吧！每一次點擊都是大腦重建通路的好練習。
    </div>
    
    <div class="mode-select">
      <!-- V2.1 新增：Level 0 單品入門練習 -->
      <button class="mode-btn selected" id="btn-m0" onclick="selectMode(0)">

        <span class="mode-btn-desc">客人在原味蛋餅、蘿蔔糕、熱/冰豆漿中，每次只點 1 樣。沒有多工壓力，專心練習一連串操作。</span>
      </button>
      <button class="mode-btn" id="btn-m1" onclick="selectMode(1)">
        <span class="mode-btn-title">Level 1: 基礎美味開店 🥪 <span>生活自立</span></span>
        <span class="mode-btn-desc">解鎖蛋餅、蘿蔔糕、豆漿，每次點 1~2 樣。需練習在設備與白瓷盤間進行調度協調。</span>
      </button>
      <button class="mode-btn" id="btn-m2" onclick="selectMode(2)">
        <span class="mode-btn-title">Level 2: 忙碌尖峰挑戰 🔥 <span>進階解鎖 🔒</span></span>

      </button>
    </div>

    <!-- V2.1 吱吱復健資源延伸卡片 -->
    <div class="rehab-card">
      <div class="rehab-card-title">🐒 吱吱復健 ‧ 楊昀霖職能治療師 專業資源</div>
      <div class="rehab-grid">
        <div class="rehab-link-group">
          <span class="rehab-link-label">中風復健懶人包</span>
          <a class="rehab-anchor" href="https://reliveot.github.io/stroke-rehab-guide/" target="_blank">📄 完整攻略閱讀</a>
        </div>
        <div class="rehab-link-group">
          <span class="rehab-link-label">帕金森生活指南</span>
          <a class="rehab-anchor" href="https://reliveot.github.io/parkinsons-rehab-guide/" target="_blank">📖 手冊下載與指南</a>
        </div>
        <div class="rehab-link-group">
          <span class="rehab-link-label">手功能線上課</span>
          <a class="rehab-anchor" href="https://reliveot.github.io/stroke-hand-course/" target="_blank">💻 患側手回到生活</a>
        </div>
        <div class="rehab-link-group">
          <span class="rehab-link-label">3D 列印練習工具</span>
          <a class="rehab-anchor" href="https://shopee.tw/peter72401" target="_blank">🛍️ 蝦皮賣場</a>
          <a class="rehab-anchor" href="https://www.youtube.com/playlist?list=PLYhYZRJq80tqVBohsxQh9XkC1cUZw-QXT" target="_blank" style="margin-top:2px;">📺 免費影片示範</a>
        </div>
      </div>
      <div style="text-align: center; margin-top: 8px; font-size: 11px; color: #7b5942; font-weight: 800;">
        官方 💬 LINE：<a href="https://lin.ee/4HnOdD4" target="_blank" style="color:var(--accent); text-decoration:underline;">@reliveot</a> | 📇 電子名片：<a href="https://reliveot.github.io/card/" target="_blank" style="color:var(--accent); text-decoration:underline;">職能治療師楊昀霖</a>
      </div>
    </div>

  // 提示用手掌 🫵 (手繪卡通風)

// ==================== 遊戲核心狀態 ====================
let currentMode = 0; // 0=Level 0, 1=Level 1, 2=Level 2
let isPlaying = false;
let score = 0;
let timeRemaining = 45;
let timerId = null;

// 客人座位資料 (最多4個座位)
let seats = [
  { active: false, customerId: null, order: null, patience: 100, timer: null, maxPatience: 25000 },
  { active: false, customerId: null, order: null, patience: 100, timer: null, maxPatience: 25000 },
  { active: false, customerId: null, order: null, patience: 100, timer: null, maxPatience: 25000 },
  { active: false, customerId: null, order: null, patience: 100, timer: null, maxPatience: 25000 }
];

// 工作站資料
// 0:蛋餅, 1:蘿蔔糕, 2:豆漿, 3:燒餅油條
let stations = [
  { id: 0, key: '蛋餅', status: 'idle', duration: 2000, current: 0 },
  { id: 1, key: '蘿蔔糕', status: 'idle', duration: 3000, current: 0 },
  { id: 2, key: '豆漿', status: 'idle', duration: 1500, current: 0 },
  { id: 3, key: '燒餅油條', status: 'idle', duration: 4000, current: 0 }
];

// 吧檯出餐盤上目前放的食物 (null / '蛋餅' / '蘿蔔糕' / '熱豆漿' / '冰豆漿' / '燒餅油條')
let plateSpots = [null, null, null, null];

// 顧客訂單池隨機抽取用
// level 0: 只有蛋餅、蘿蔔糕、熱豆漿、冰豆漿四種，每次 1 樣
const foodPoolLevel0 = ['蛋餅', '蘿蔔糕', '熱豆漿', '冰豆漿'];
const foodPoolLevel1 = ['蛋餅', '蘿蔔糕', '熱豆漿', '冰豆漿'];
const foodPoolLevel2 = ['蛋餅', '蘿蔔糕', '熱豆漿', '冰豆漿', '燒餅油條'];

// ==================== 初始化 ====================
window.onload = function() {
  setupInitialScreen();
};

function setupInitialScreen() {
  // 初始化工作站資產與手指
  document.getElementById('asset-0').style.backgroundImage = `url('${ASSETS.equip[0]}')`;
  document.getElementById('asset-1').style.backgroundImage = `url('${ASSETS.equip[1]}')`;
  document.getElementById('asset-2').style.backgroundImage = `url('${ASSETS.equip[2]}')`;
  document.getElementById('asset-3').style.backgroundImage = `url('${ASSETS.equip[3]}')`;
  document.getElementById('action-hand').style.backgroundImage = `url('${ASSETS.hand}')`;

  // 初始化吧檯出餐盤白瓷盤樣式
  for (let i = 0; i < 4; i++) {
    renderPlate(i);
  }
}

function openSetting() {
  isPlaying = false;
  clearInterval(timerId);
  seats.forEach((s, idx) => clearSeat(idx));
  document.getElementById('setting-modal').style.display = 'flex';
}

function selectMode(m) {
  currentMode = m;
  document.querySelectorAll('.mode-btn').forEach((b, idx) => {
    if (idx === m) b.classList.add('selected');
    else b.classList.remove('selected');
  });
}

// 開始營業
function startGame() {
  document.getElementById('setting-modal').style.display = 'none';
  isPlaying = true;
  score = 0;
  timeRemaining = currentMode === 0 ? 60 : 45; // Level 0 緩衝時間長一點
  
  document.getElementById('score-display').innerText = `🌟 分數: ${score}`;
  document.getElementById('timer-display').innerText = `⏱️ 時間: ${timeRemaining}`;
  document.getElementById('level-display').innerText = currentMode === 0 ? "關卡: L0 單品入門" : currentMode === 1 ? "關卡: L1 基礎開店" : "關卡: L2 尖峰挑戰";

  // 根據關卡解鎖對應工作站 (V2.1 進階鎖定視覺更新)
  if (currentMode === 2) {
    document.getElementById('station-3').classList.remove('disabled');
    document.getElementById('lock-3').style.display = 'none';
    document.getElementById('btn-3').disabled = false;
  } else {
    document.getElementById('station-3').classList.add('disabled');
    document.getElementById('lock-3').style.display = 'flex';
    document.getElementById('btn-3').disabled = true;
  }

  // 吧檯出餐盤清空
  for(let i=0; i<4; i++) {
    plateSpots[i] = null;
    renderPlate(i);
    clearSeat(i);
  }

  // 重置工作站
  stations.forEach(st => {
    st.status = 'idle';
    st.current = 0;
    updateStationUI(st.id);
  });

  // 開啟倒數計時
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!isPlaying) return;
    timeRemaining--;
    document.getElementById('timer-display').innerText = `⏱️ 時間: ${timeRemaining}`;
    if (timeRemaining <= 0) {
      endGame();
    }
  }, 1000);

  // 第一個客人快速到店
  setTimeout(() => { if(isPlaying) spawnCustomer(); }, 800);
}

// ==================== 客人管理 ====================
function spawnCustomer() {
  if (!isPlaying) return;

  // 尋找空座位
  let emptySeats = [];
  seats.forEach((s, idx) => { if(!s.active) emptySeats.push(idx); });

  if (emptySeats.length > 0) {
    let seatIdx = emptySeats[Math.floor(Math.random() * emptySeats.length)];
    let s = seats[seatIdx];

    // 隨機選取頭像
    s.customerId = Math.floor(Math.random() * ASSETS.customer.length);
    s.active = true;

    // 根據關卡產生訂單 (Level 0 每次固定只點 1 樣)
    let pool = currentMode === 2 ? foodPoolLevel2 : foodPoolLevel0;
    s.order = pool[Math.floor(Math.random() * pool.length)];

    // 耐心設定：Level 0 更慈祥(35秒)，其他隨機
    s.patience = 100;
    s.maxPatience = currentMode === 0 ? 35000 : (20000 + Math.random() * 8000);

    // 渲染客人與點單泡泡
    let sEl = document.getElementById(`seat-${seatIdx}`);
    sEl.classList.add('waiting');
    document.getElementById(`cust-sprite-${seatIdx}`).style.backgroundImage = `url('${ASSETS.customer[s.customerId]}')`;
    
    // 渲染點單圖片
    let foodIdx = 0;
    if (s.order === '蛋餅') foodIdx = 0;
    else if (s.order === '蘿蔔糕') foodIdx = 1;
    else if (s.order === '熱豆漿') foodIdx = 2;
    else if (s.order === '冰豆漿') foodIdx = 3;
    else if (s.order === '燒餅油條') foodIdx = 4;

    document.getElementById(`order-img-${seatIdx}`).style.backgroundImage = `url('${ASSETS.food[foodIdx]}')`;
    document.getElementById(`bubble-${seatIdx}`).style.display = 'flex';

    // 耐心倒數
    let startTime = Date.now();
    s.timer = setInterval(() => {
      let elapsed = Date.now() - startTime;
      s.patience = Math.max(0, 100 - (elapsed / s.maxPatience) * 100);
      document.getElementById(`patience-${seatIdx}`).style.width = `${s.patience}%`;

      if (s.patience <= 0) {
        // 耐心用完生氣離場
        triggerFlyText(seatIdx, "💔 太久了啦...", "#a04f32");
        clearSeat(seatIdx);
        // 補新客人
        setTimeout(() => { if(isPlaying) spawnCustomer(); }, Math.random() * 2000 + 1000);
      }
    }, 100);

    // 智慧手指引導 (只在 Level 0 出現，提示該做什麼)
    if (currentMode === 0) {
      suggestActionGuide();
    }
  }

  // 隨機在時間到前持續引流客人 (Level 0 人流最緩慢，每 5-7 秒，Level 2 每 3-4 秒)
  let nextSpawn = currentMode === 0 ? 6000 + Math.random() * 2000 : currentMode === 1 ? 4000 + Math.random() * 2000 : 2500 + Math.random() * 2000;
  setTimeout(() => {
    let activeCount = seats.filter(s => s.active).length;
    let maxAllowed = currentMode === 0 ? 2 : currentMode === 1 ? 3 : 4; // Level 0 最多一次 2 位客人
    if (isPlaying && activeCount < maxAllowed) spawnCustomer();
  }, nextSpawn);
}

function clearSeat(idx) {
  let s = seats[idx];
  s.active = false;
  s.customerId = null;
  s.order = null;
  s.patience = 100;
  if(s.timer) clearInterval(s.timer);
  s.timer = null;

  document.getElementById(`seat-${idx}`).classList.remove('waiting');
  document.getElementById(`cust-sprite-${idx}`).style.backgroundImage = 'none';
  document.getElementById(`bubble-${idx}`).style.display = 'none';
}

// ==================== 廚房烹飪與出餐操作 ====================
function clickStation(stIdx) {
  if (!isPlaying) return;
  let st = stations[stIdx];

  // V2.1 防止點擊未解鎖區域
  if (currentMode !== 2 && stIdx === 3) return;

  if (st.status === 'idle') {
    // 1. 開始製作
    st.status = 'cooking';
    st.current = 0;
    let cookbar = document.getElementById(`cookbar-${stIdx}`);
    let progress = document.getElementById(`progress-${stIdx}`);
    cookbar.style.display = 'block';
    progress.style.width = '0%';

    let step = 100;
    let interval = st.duration / (st.duration / step);
    let timer = setInterval(() => {
      if (!isPlaying) { clearInterval(timer); return; }
      st.current += step;
      let pct = Math.min(100, (st.current / st.duration) * 100);
      progress.style.width = `${pct}%`;

      if (st.current >= st.duration) {
        clearInterval(timer);
        st.status = 'ready';
        cookbar.style.display = 'none';
        updateStationUI(stIdx);
        // Level 0 自動顯示引導
        if (currentMode === 0) suggestActionGuide();
      }
    }, step);

    updateStationUI(stIdx);
  } 
  else if (st.status === 'ready') {
    // 2. 取出食物，需尋找空的吧檯出餐盤白瓷盤
    let emptyPlateIdx = plateSpots.indexOf(null);
    if (emptyPlateIdx !== -1) {
      // 放到第一個空盤
      plateSpots[emptyPlateIdx] = st.key === '豆漿' ? (Math.random() > 0.5 ? '熱豆漿' : '冰豆漿') : st.key; // 豆漿區隨機
      st.status = 'idle';
      st.current = 0;
      updateStationUI(stIdx);
      renderPlate(emptyPlateIdx);

      triggerFlyTextAtSpot(document.getElementById(`plate-${emptyPlateIdx}`), "✨ 取出餐點！", "#697655");
      if (currentMode === 0) suggestActionGuide();
    } else {
      triggerFlyTextAtSpot(document.getElementById(`asset-${stIdx}`), "❌ 沒有空盤子啦！", "#a04f32");
    }
  }
}

function clickPlate(event, idx) {
  // 阻止冒泡避免誤點送餐
  event.stopPropagation();
  if (!isPlaying) return;

  if (plateSpots[idx] !== null) {
    // 點擊盤子嘗試配對該座位客人的訂單
    let food = plateSpots[idx];
    let matchedSeat = -1;

    // 優先尋找此座位的客人的訂單配對
    if (seats[idx].active && seats[idx].order === food) {
      matchedSeat = idx;
    } else {
      // 否則尋找其他座位有需要的客人
      for (let i = 0; i < 4; i++) {
        if (seats[i].active && seats[i].order === food) {
          matchedSeat = i;
          break;
        }
      }
    }

    if (matchedSeat !== -1) {
      // 送餐成功
      score += Math.round(seats[matchedSeat].patience * 2);
      document.getElementById('score-display').innerText = `🌟 分數: ${score}`;
      triggerFlyText(matchedSeat, "🎉 感恩！好吃！", "#81b29a");

      clearSeat(matchedSeat);
      plateSpots[idx] = null;
      renderPlate(idx);

      // 補新客人
      setTimeout(() => { if(isPlaying) spawnCustomer(); }, Math.random() * 2000 + 1000);
      if (currentMode === 0) suggestActionGuide();
    } else {
      triggerFlyTextAtSpot(document.getElementById(`plate-${idx}`), "🗑️ 丟棄餐點", "#a04f32");
      plateSpots[idx] = null;
      renderPlate(idx);
    }
  }
}

// 當玩家點客人或送餐
function deliverOrder(seatIdx) {
  // 當直接點座位時，嘗試看看哪個盤子有對應的餐點送出
  if (!isPlaying || !seats[seatIdx].active) return;
  let targetOrder = seats[seatIdx].order;

  let matchedPlate = plateSpots.indexOf(targetOrder);
  if (matchedPlate !== -1) {
    // 送餐
    score += Math.round(seats[seatIdx].patience * 2);
    document.getElementById('score-display').innerText = `🌟 分數: ${score}`;
    triggerFlyText(seatIdx, "🎉 送達！謝謝！", "#81b29a");

    clearSeat(seatIdx);
    plateSpots[matchedPlate] = null;
    renderPlate(matchedPlate);

    setTimeout(() => { if(isPlaying) spawnCustomer(); }, Math.random() * 2000 + 1000);
    if (currentMode === 0) suggestActionGuide();
  } else {
    triggerFlyText(seatIdx, "❓ 還沒做好喔", "#a3a19e");
  }
}

// ==================== UI 渲染方法 ====================
function updateStationUI(stIdx) {
  let st = stations[stIdx];
  let btn = document.getElementById(`btn-${stIdx}`);
  let asset = document.getElementById(`asset-${stIdx}`);

  // V2.1 進階鎖定不更新 UI
  if (currentMode !== 2 && stIdx === 3) return;

  if (st.status === 'idle') {
    btn.innerText = `製作${st.key}`;
    btn.className = "action-btn";
    asset.style.transform = "none";
    asset.style.filter = "none";
  } else if (st.status === 'cooking') {
    btn.innerText = "製作中...";
    btn.className = "action-btn active-make";
    asset.style.transform = "scale(0.95) rotate(-2deg)";
  } else if (st.status === 'ready') {
    btn.innerText = "完成！(點擊取出)";
    btn.className = "action-btn ready-get";
    asset.style.transform = "scale(1.05) translateY(-2px)";
    // 呼吸閃爍
    asset.style.filter = "drop-shadow(0 0 4px #81b29a)";
  }
}

function renderPlate(idx) {
  let pEl = document.getElementById(`plate-${idx}`);
  let food = plateSpots[idx];
  if (food === null) {
    pEl.innerHTML = '';
  } else {
    let foodIdx = 0;
    if (food === '蛋餅') foodIdx = 0;
    else if (food === '蘿蔔糕') foodIdx = 1;
    else if (food === '熱豆漿') foodIdx = 2;
    else if (food === '冰豆漿') foodIdx = 3;
    else if (food === '燒餅油條') foodIdx = 4;
    
    pEl.innerHTML = `<div class="held-food" style="background-image: url('${ASSETS.food[foodIdx]}')"></div>`;
  }
}

// 飄字特效
function triggerFlyText(seatIdx, text, color) {
  let seatEl = document.getElementById(`seat-${seatIdx}`);
  triggerFlyTextAtSpot(seatEl, text, color);
}

function triggerFlyTextAtSpot(el, text, color) {
  let rect = el.getBoundingClientRect();
  let containerRect = document.getElementById('game-container').getBoundingClientRect();
  
  let x = rect.left + rect.width/2 - containerRect.left;
  let y = rect.top - containerRect.top;

  let fly = document.createElement('div');
  fly.className = 'fly-text';
  fly.innerText = text;
  fly.style.color = color;
  fly.style.left = `${x}px`;
  fly.style.top = `${y}px`;

  document.getElementById('game-container').appendChild(fly);
  setTimeout(() => fly.remove(), 800);
}

// ==================== 自適應視覺導引 (針對 Level 0 單品入門) ====================
function suggestActionGuide() {
  let hand = document.getElementById('action-hand');
  if (currentMode !== 0 || !isPlaying) {
    hand.style.display = 'none';
    return;
  }

  // 1. 尋找等待中的客人訂單
  let waitingIdx = seats.findIndex(s => s.active);
  if (waitingIdx === -1) {
    hand.style.display = 'none';
    return;
  }
  let order = seats[waitingIdx].order;

  // 對應設備索引 
  let targetStationIdx = -1;
  if (order === '蛋餅') targetStationIdx = 0;
  else if (order === '蘿蔔糕') targetStationIdx = 1;
  else if (order === '熱豆漿' || order === '冰豆漿') targetStationIdx = 2;

  // A. 檢查此餐點是否已在盤子上？如果是，導引「去按該盤子 ➔ 再按客人」
  let matchedPlateIdx = plateSpots.indexOf(order);
  if (matchedPlateIdx !== -1) {
    moveHandTo(`plate-${matchedPlateIdx}`);
    return;
  }

  // B. 檢查設備是否已完成該食物？
  let targetStation = stations[targetStationIdx];
  if (targetStation.status === 'ready') {
    moveHandTo(`btn-${targetStationIdx}`);
    return;
  }

  // C. 如果設備閒置中，導引「開始製作」
  if (targetStation.status === 'idle') {
    moveHandTo(`btn-${targetStationIdx}`);
    return;
  }

  hand.style.display = 'none';
}

function moveHandTo(elementId) {
  let hand = document.getElementById('action-hand');
  let el = document.getElementById(elementId);
  if (!el) return;

  let rect = el.getBoundingClientRect();
  let containerRect = document.getElementById('game-container').getBoundingClientRect();
  
  let x = rect.left + rect.width/2 - containerRect.left + 15;
  let y = rect.top + rect.height/2 - containerRect.top + 15;

  hand.style.display = 'block';
  hand.style.left = `${x}px`;
  hand.style.top = `${y}px`;
}

// ==================== 結束遊戲 ====================
function endGame() {
  isPlaying = false;
  clearInterval(timerId);
  seats.forEach((s, idx) => { if(s.timer) clearInterval(s.timer); });

  alert(`🎯 時間到囉！您本場獲得的復健分數是：${score} 分！\n太棒了，手部操作做得很好喔！🎉`);
  openSetting();
}
</script>
